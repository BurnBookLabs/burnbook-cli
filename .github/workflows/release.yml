name: Publish CLI

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Pack and publish with provenance
        shell: bash
        run: |
          set -euo pipefail
          VERSION="\${GITHUB_REF_NAME#cli-v}"
          ACTUAL="$(node -p "require('./packages/cli/package.json').version")"
          test "$VERSION" = "$ACTUAL"
          mkdir -p "$RUNNER_TEMP/package"
          pnpm --filter burnbook pack --pack-destination "$RUNNER_TEMP/package"
          npm publish "$RUNNER_TEMP/package/burnbook-$VERSION.tgz" --provenance --access public
