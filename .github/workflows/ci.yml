name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  packed-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run complete CLI test suite
        if: runner.os != 'Windows'
        run: pnpm test
      - name: Run Windows service contract tests
        if: runner.os == 'Windows'
        run: |
          pnpm --filter @burnbook/schema build
          pnpm --filter burnbook exec vitest run test/platform/cross-platform-services.test.ts
      - run: pnpm build
      - name: Install packed artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package" "$RUNNER_TEMP/install"
          pnpm --filter burnbook pack --pack-destination "$RUNNER_TEMP/package"
          cd "$RUNNER_TEMP/install"
          npm init --yes
          npm install --ignore-scripts "$RUNNER_TEMP/package"/burnbook-*.tgz
          npx --no-install burn --version
